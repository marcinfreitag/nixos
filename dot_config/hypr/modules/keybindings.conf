#
# Keybindings
#

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, B, exec, $webBrowser
bind = $mainMod, E, exec, $emailClient
bind = $mainMod, C, killactive,
bind = $mainMod, S, exec, $binPath/syncthing-start.sh
bind = $mainMod SHIFT, S, exec, $binPath/syncthing-stop.sh
#bind = $mainMod SHIFT, M, exit,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, T, exec, teamviewer
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $shiftMod, F, fullscreenstate
bind = $mainMod SHIFT, P, exec, $binPath/shell/powermenu.sh
bind = $mainMod CTRL, L, exec, hyprlock
bind = $mainMod SHIFT, W, exec, $terminal --class console_dialog set-wallpaper.sh
#bind = $mainMod, W, exec, $binPath/start-vm.sh
bind = $mainMod, I, exec, $terminal --class console_dialog nmtui
bind = $mainMod, O, exec, $terminal --class console_dialog bluetuith
bind = $mainMod, G, exec, $binPath/grayjay
# hyprshot
env = HYPRSHOT_DIR, $HOME/Pictures/hyprshot
# screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window -m active
# screenshot a monitor
bind = , PRINT, exec, hyprshot -m output -m active
# Screenshot a region
bind = $shiftMod, PRINT, exec, hyprshot -m region

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, $binPath/shell/change-volume.sh 5
bindel = ,XF86AudioLowerVolume, exec, $binPath/shell/change-volume.sh -5
bindel = ,XF86AudioMute, exec, $binPath/shell/toggle-volume-mute.sh
bindel = ,XF86AudioMicMute, exec, $binPath/shell/toggle-microphone-mute.sh
bindel = ,XF86MonBrightnessUp, exec, $binPath/shell/change-brightness.sh 5
bindel = ,XF86MonBrightnessDown, exec, $binPath/shell/change-brightness.sh -5

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Thinkpad keys
bind = ,XF86Tools, exec, $terminal htop
bind = ,XF86Keyboard, exec, $binPath/shell/change-kbd-layout.sh
bind = $mainMod,SPACE, exec, $binPath/shell/change-kbd-layout.sh
#bindr = ALT_L, SHIFT_L, exec, $binPath/shell/switch-kbd-layout.sh
bind = ,XF86Display, exec, $binPath/shell/set-monitors-fallback.sh

